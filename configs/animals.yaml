dataset: Animals

dataset_path: dataset/animals

num_classes: auto

batch_size: 32

epochs: 30

image_size: 224

learning_rate: 0.0001

weight_decay: 0.0001

model:
    name: resnet18
    pretrained: true

optimizer:
    AdamW

scheduler:
    cosine

augmentation:
    flip: true
    color_jitter: true
    random_crop: true
